name: nightly — summaries, Moodle, dashboard

on:
  schedule:
    - cron: '30 19 * * 0-5'      # 21:30–22:30 Israel time (GitHub cron is UTC). Sun–Fri.
  workflow_dispatch:
    inputs:
      args:
        description: 'extra arguments, e.g. --dry-run   or   --only "הסתברות" --clip-min 5'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAU_USERNAME: ${{ secrets.TAU_USERNAME }}
      TAU_ID: ${{ secrets.TAU_ID }}
      TAU_PASSWORD: ${{ secrets.TAU_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTEBOOKLM_STORAGE: ${{ secrets.NOTEBOOKLM_STORAGE }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-notebooklm.txt
        if: env.NOTEBOOKLM_STORAGE != ''
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m src.nightly ${{ github.event.inputs.args }}
      - name: save what was done (summaries, Moodle files, state, dashboard)
        if: always()
        run: |
          git config user.name "study-bot"
          git config user.email "study-bot@users.noreply.github.com"
          git add state summaries materials docs config 2>/dev/null || true
          git diff --cached --quiet || git commit -m "nightly $(date +%Y-%m-%d)"
          git push
